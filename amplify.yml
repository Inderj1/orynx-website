version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm install -g pnpm@10.7.0
        - pnpm install --frozen-lockfile --force
    build:
      commands:
        - pnpm build
  artifacts:
    baseDirectory: out
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
